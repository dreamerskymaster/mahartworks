# Checks the site on every push and pull request: Python tests (sync rules, watermark, site data and
# links) and browser tests on phone, tablet and laptop screen sizes (layout, spotlight, gallery, viewer,
# settings). The Drive sync pushes are skipped: sync.yml already runs the Python tests before those.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - run: pip install -r build/requirements.txt
      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --prefix tests/e2e
      - name: Browser tests (phone, tablet, laptop)
        run: npm test --prefix tests/e2e
        env:
          CHROME: /usr/bin/google-chrome

  # The shop (shop/, deployed separately as mah-artworks-shop): unit tests (shipping table, PINs, UPI links,
  # order numbers, cart, the /api/shipping-quote function) and browser tests against a local mock of Supabase.
  # The database security tests (supabase/tests/shop_security.sql) run against the real project by hand.
  shop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/shop/package-lock.json
      - run: npm ci --prefix tests/shop
      - name: Shop unit tests
        run: npm run test:unit --prefix tests/shop
      - name: Shop browser tests (phone, laptop)
        run: npm run test:e2e --prefix tests/shop
        env:
          CHROME: /usr/bin/google-chrome
