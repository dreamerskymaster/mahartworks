# Read the "my artworks" Drive folder, rebuild the gallery if anything changed, and push — Cloudflare Pages
# publishes every push. Each run starts the next one 20 minutes later (job `next`), so the site keeps up
# with her uploads; GitHub's own cron is best-effort (it fired every 4-8 h) and only restarts the chain if
# it ever breaks. Run by hand from the Actions tab to publish straight away or to switch the watermark.
# To pause everything: Actions -> this workflow -> "..." -> Disable workflow.
name: Sync artworks from Google Drive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      watermark:
        description: "Watermark style: 1 colour seal, 2 white stamp, 3 big faint + corner (blank = keep)"
        required: false
        default: ""
      allow_big_removal:
        description: "Allow removing more than a third of the artworks in one go"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - run: pip install -r build/requirements.txt

      - name: Compare Drive with the catalog
        id: sync
        run: python3 build/sync.py
        env:
          ALLOW_BIG_REMOVAL: ${{ inputs.allow_big_removal && '1' || '' }}

      - name: Rebuild gallery
        if: steps.sync.outputs.changed == 'true' || inputs.watermark != ''
        run: python3 build/build.py ${{ inputs.watermark != '' && format('--wm {0}', inputs.watermark) || '' }}

      - name: Publish
        run: |
          git add -A build/catalog.tsv build/manifest.json site
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "artworks-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from Drive: ${{ steps.sync.outputs.summary }}"
          git push

  # Start the next sync in 20 minutes, using the built-in token (no personal token needed).
  next:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: sleep 1200
      - name: Queue the next run (unless one is already waiting)
        run: |
          waiting=$(gh run list --workflow sync.yml --branch "${{ github.ref_name }}" --status queued --json databaseId --jq length)
          if [ "$waiting" != "0" ]; then echo "A run is already queued."; exit 0; fi
          gh workflow run sync.yml --ref "${{ github.ref_name }}"
