# Every 3 hours: read the "my artworks" Drive folder, rebuild the gallery if anything changed,
# and push to main — Cloudflare Pages publishes every push. Run by hand from the Actions tab
# ("Run workflow") to publish straight away or to switch the watermark style.
name: Sync artworks from Google Drive

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      watermark:
        description: "Watermark style: 1 colour seal, 2 white stamp, 3 big faint + corner (blank = keep)"
        required: false
        default: ""
      allow_big_removal:
        description: "Allow removing more than a third of the artworks in one go"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - run: pip install -r build/requirements.txt

      - name: Compare Drive with the catalog
        id: sync
        run: python3 build/sync.py
        env:
          ALLOW_BIG_REMOVAL: ${{ inputs.allow_big_removal && '1' || '' }}

      - name: Rebuild gallery
        if: steps.sync.outputs.changed == 'true' || inputs.watermark != ''
        run: python3 build/build.py ${{ inputs.watermark != '' && format('--wm {0}', inputs.watermark) || '' }}

      - name: Publish
        run: |
          git add -A build/catalog.tsv build/manifest.json site
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "artworks-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from Drive: ${{ steps.sync.outputs.summary }}"
          git push
